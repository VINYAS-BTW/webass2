<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Registration Form</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Registration Form</h2>
      <form id="registrationForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="your.email@example.com"
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            required
            placeholder="+91 XXX-XXX-XXXXX"
          />
        </div>

        <div class="form-group">
          <label for="course">Select Course</label>
          <select id="course" name="course" required>
            <option value="">-- Choose a course --</option>
            <option value="Web Development">Web Development</option>
            <option value="Data Science">Data Science</option>
            <option value="AI & ML">AI & Machine Learning</option>
            <option value="Cyber Security">Cyber Security</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Why do you want to join?</label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell us about your interest..."
          ></textarea>
        </div>

        <button type="submit">Submit Application</button>
      </form>

      <div id="response"></div>
    </div>
    <!-- ✅ Load jQuery first -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <!-- ✅ Then load your custom script -->
    <script src="script.js"></script>
  </body>
</html>
